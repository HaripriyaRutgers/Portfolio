<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari Priya Tumuluri — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <button type="button" class="site-brand" id="brandHome" aria-label="Return to the About page">Hari Priya Tumuluri</button>
  <nav class="site-nav">
    <a data-target="0" class="active">About</a>
    <a data-target="1">Work</a>
    <a data-target="5">Resume</a>
    <a data-target="6">Contact</a>
  </nav>
</header>

<div class="stage">
  <div class="craft-workspace">
    <img class="craft-item craft-ribbon" src="images/coralribbon.png" alt="">
    <img class="craft-item craft-glue-stick" src="images/glue stick.png" alt="">
    <img class="craft-item craft-glue" src="images/glue.png" alt="">
    <img class="craft-item craft-scissors" src="images/scissors.png" alt="">
    <img class="craft-item craft-tape" src="images/tape.png" alt="">

    <div class="book-shell">
    <div class="book-pages" id="bookPages">
      <div class="board board-left" id="boardLeft"></div>
      <div class="board board-right" id="boardRight"></div>

      <!-- animating leaf -->
      <div class="flip-leaf" id="flipLeaf">
        <div class="face front" id="leafFront"></div>
        <div class="face back" id="leafBack"></div>
      </div>

      <!-- ring binder spine -->
      <div class="spine">
        <div class="cap top"></div>
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>
        <div class="ring r5"></div>
        <div class="ring r6"></div>
        <div class="rod"></div>
        <div class="cap bot"></div>
      </div>

      <!-- corner turn-zones (all 4 corners) -->
      <div class="turn-zone next" data-dir="next"></div>
      <div class="turn-zone prev" data-dir="prev"></div>
      <div class="turn-zone next-top" data-dir="next"></div>
      <div class="turn-zone prev-top" data-dir="prev"></div>

      <!-- click either outer page edge to turn one spread -->
      <button type="button" class="page-side-zone prev-side" data-dir="prev" aria-label="Turn to the previous spread"></button>
      <button type="button" class="page-side-zone next-side" data-dir="next" aria-label="Turn to the next spread"></button>
    </div>

    </div>
  </div>

  <div class="chrome">
    <button id="btnPrev">‹ back</button>
    <span id="progress">about — 1/7</span>
    <button id="btnNext">next ›</button>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
